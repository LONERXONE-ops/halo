name: Emulator test

on:
  push:
    branches: [ emu ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the probe
        run: gradle -p probe :app:assembleDebug --no-daemon -q

      - name: Get the latest Halo and Halo Launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk dl
          gh release download -R LONERXONE-ops/halo --pattern '*.apk' -D dl/h
          gh release download -R LONERXONE-ops/halo-launcher --pattern '*.apk' -D dl/l
          cp dl/h/*.apk apk/halo.apk
          cp dl/l/*.apk apk/launcher.apk
          cp probe/app/build/outputs/apk/debug/app-debug.apk apk/probe.apk
          ls -la apk dl/h dl/l

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: ./run.sh

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: out/
