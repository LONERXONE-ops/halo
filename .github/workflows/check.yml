name: Compile check

on:
  push:
    branches: [ check ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile
        run: |
          set -o pipefail
          gradle :app:compileReleaseKotlin --no-daemon 2>&1 | tee build.log
      - name: Errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -60
