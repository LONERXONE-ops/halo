name: Build Halo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        run: base64 -d app/halo.keystore.b64 > app/halo.keystore

      - name: Build APK
        run: |
          set -o pipefail
          touch build.log
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          V="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Halo-$V.apk"
          gh release create "v$V" "Halo-$V.apk" --title "Halo $V" --notes "${NOTES:-Manual build}"

      - name: Report failure
        if: failure()
        run: |
          touch build.log
          git config user.name "halo-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log
          git checkout --orphan ci-log
          git rm -rf --quiet . || true
          cp /tmp/log/build.log build.log
          echo "${{ github.run_number }}" > run.txt
          git add build.log run.txt
          git commit -q -m "Build log for failed run ${{ github.run_number }}"
          git push -f origin ci-log
