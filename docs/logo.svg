<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <g id="ring">
      <ellipse cx="256" cy="148" rx="118" ry="36" transform="rotate(-7 256 148)" fill="none"/>
    </g>
    <g id="head">
      <rect x="128" y="226" width="256" height="164" rx="82" ry="82"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <!-- glow -->
  <g filter="url(#glow)" opacity="0.9">
    <use href="#ring" stroke="#fff" stroke-width="48"/>
    <use href="#head" fill="#fff" stroke="#fff" stroke-width="30"/>
  </g>
  <!-- white rim -->
  <use href="#ring" stroke="#fff" stroke-width="50"/>
  <use href="#head" fill="#fff" stroke="#fff" stroke-width="26"/>
  <!-- black line -->
  <use href="#ring" stroke="#000" stroke-width="38"/>
  <use href="#head" fill="#fff" stroke="#000" stroke-width="13"/>
  <!-- the halo itself -->
  <use href="#ring" stroke="#fff" stroke-width="20"/>
  <!-- face: x eye and a happy closed eye, like the bunny -->
  <g stroke="#000" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M196 296 l26 26 M222 296 l-26 26"/>
    <path d="M282 322 q24 -32 48 0"/>
  </g>
  <!-- little cheek tick -->
  <path d="M150 288 q14 6 18 22" stroke="#000" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
